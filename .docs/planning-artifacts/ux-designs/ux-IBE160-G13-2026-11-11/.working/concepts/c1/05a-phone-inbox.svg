  <circle cx="42" cy="387" r="25" fill="none" stroke="#C8FF2E" stroke-width="2.5"/><circle cx="42" cy="387" r="21" fill="#F5F3EE"/><text x="42" y="393" class="u" font-size="16" font-weight="800" fill="#0D0E13" text-anchor="middle">L</text><text x="76" y="381" class="u" font-size="15" font-weight="800" fill="#F5F3EE">Line · Butikken</text><rect x="314.4" y="366" width="59.6" height="22" rx="11" fill="#F5F3EE"/><text x="344.2" y="381.5" class="u" font-size="11.5" font-weight="800" fill="#0D0E13" text-anchor="middle">Tilbud</text><text x="76" y="402" class="u" font-size="13" font-weight="600" fill="#B4B6C4">Ekstravakter mai–juli? Gjelder bare i april</text><rect x="76" y="421.5" width="298" height="1" fill="#1F2130"/>
  <circle cx="42" cy="459" r="25" fill="none" stroke="#C8FF2E" stroke-width="2.5"/><circle cx="42" cy="459" r="21" fill="#22252F"/><use href="#i-bank" x="31" y="448" width="22" height="22" color="#F5F3EE"/><text x="76" y="453" class="u" font-size="15" font-weight="800" fill="#F5F3EE">Sparebanken</text><rect x="327.6" y="438" width="46.4" height="22" rx="11" fill="none" stroke="#8C8FA0" stroke-width="1.4"/><text x="350.8" y="453.5" class="u" font-size="11.5" font-weight="800" fill="#B4B6C4" text-anchor="middle">Info</text><text x="76" y="474" class="u" font-size="13" font-weight="600" fill="#B4B6C4">Renter så langt: 51 kr. Pengene jobber.</text><rect x="76" y="493.5" width="298" height="1" fill="#1F2130"/>
  <text x="16" y="522" class="u" font-size="13" font-weight="800" fill="#B4B6C4">Tidligere</text>
