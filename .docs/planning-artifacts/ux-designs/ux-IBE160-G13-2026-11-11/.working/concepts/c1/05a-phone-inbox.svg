  <circle cx="42" cy="641" r="21" fill="#22252F"/><use href="#i-bank" x="31" y="630" width="22" height="22" color="#F5F3EE"/><text x="76" y="635" class="u" font-size="15" font-weight="800" fill="#F5F3EE">Sparebanken</text><rect x="314.4" y="620" width="59.6" height="22" rx="11" fill="#F5F3EE"/><text x="344.2" y="635.5" class="u" font-size="11.5" font-weight="800" fill="#0D0E13" text-anchor="middle">Tilbud</text><text x="76" y="656" class="u" font-size="13" font-weight="600" fill="#B4B6C4">Mopedlappen er åpen. Mangler 3 220 kr.</text><rect x="76" y="675.5" width="298" height="1" fill="#1F2130"/>
  <circle cx="42" cy="713" r="21" fill="#8C8FA0" fill-opacity="0.45"/><text x="42" y="719" class="u" font-size="16" font-weight="800" fill="#0D0E13" text-anchor="middle">J</text><text x="76" y="707" class="u" font-size="15" font-weight="800" fill="#B4B6C4">Jonas</text><rect x="314.4" y="692" width="59.6" height="22" rx="11" fill="none" stroke="#FFB020" stroke-width="1.4"/><text x="344.2" y="707.5" class="u" font-size="11.5" font-weight="800" fill="#FFB020" text-anchor="middle">Utløpt</text><text x="76" y="728" class="u" font-size="13" font-weight="600" fill="#8C8FA0">Gaming-kveld hos meg? Gikk ut i mars</text><rect x="76" y="747.5" width="298" height="1" fill="#1F2130"/>
