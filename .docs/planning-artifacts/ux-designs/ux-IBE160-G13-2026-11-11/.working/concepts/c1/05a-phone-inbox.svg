  <circle cx="42" cy="243" r="25" fill="none" stroke="#C8FF2E" stroke-width="2.5"/><circle cx="42" cy="243" r="21" fill="#FF4F8B"/><text x="42" y="249" class="u" font-size="16" font-weight="800" fill="#0D0E13" text-anchor="middle">M</text><text x="76" y="237" class="u" font-size="15" font-weight="800" fill="#F5F3EE">Mamma</text><rect x="301.2" y="222" width="72.8" height="22" rx="11" fill="#FF4F8B"/><text x="337.59999999999997" y="237.5" class="u" font-size="11.5" font-weight="800" fill="#0D0E13" text-anchor="middle">Hendelse</text><text x="76" y="258" class="u" font-size="13" font-weight="600" fill="#B4B6C4">Så du skjermen din?? Du valgte: bytt skjerm</text><rect x="76" y="277.5" width="298" height="1" fill="#1F2130"/>
