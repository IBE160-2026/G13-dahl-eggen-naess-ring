  <text x="46" y="403" class="u" font-size="11.5" font-weight="700" fill="#8C8FA0">August · 15 år · ditt valg</text>
  <text x="46" y="426" class="u" font-size="15" font-weight="800" fill="#F5F3EE">Nei takk til mobilforsikring</text>
  <text x="346" y="426" class="u" font-size="12" font-weight="700" fill="#B4B6C4" text-anchor="end">49 kr/mnd</text>
  <text x="32" y="463" class="u" font-size="13" font-weight="600" fill="#B4B6C4">Uten forsikring betalte du hele regningen.</text>
  <text x="32" y="480" class="u" font-size="13" font-weight="600" fill="#B4B6C4">Med den hadde du betalt 500 kr.</text>

  <rect x="16" y="500" width="62" height="24" rx="12" fill="#C8FF2E"/><text x="47" y="516.5" class="u" font-size="12" font-weight="800" fill="#0D0E13" text-anchor="middle">Åpnet</text>
  <text x="88" y="517" class="u" font-size="13" font-weight="600" fill="#F5F3EE">Mobilforsikring kan tegnes igjen fra mai</text>
  <rect x="16" y="532" width="62" height="24" rx="12" fill="none" stroke="#8C8FA0"/><text x="47" y="548.5" class="u" font-size="12" font-weight="800" fill="#B4B6C4" text-anchor="middle">Lukket</text>
  <text x="88" y="549" class="u" font-size="13" font-weight="600" fill="#B4B6C4">Toppmodellen – ikke denne måneden</text>

