  <rect x="22" y="338" width="230" height="32" rx="16" fill="#0D0E13"/>
  <use href="#i-echo" x="33" y="346" width="16" height="16" color="#FF4F8B"/>
  <text x="56" y="359" class="u" font-size="13" font-weight="800" fill="#FF4F8B">Ekko fra august</text>
  <text x="22" y="398" class="u" font-size="13.5" font-weight="700" fill="#0D0E13">I august sa du nei takk til</text>
  <text x="22" y="416" class="u" font-size="13.5" font-weight="700" fill="#0D0E13">mobilforsikring til 49 kr i måneden.</text>
  <use href="#i-bulb" x="22" y="436" width="16" height="16" color="#0D0E13"/>
  <text x="44" y="449" class="u" font-size="12" font-weight="700" fill="#0D0E13">Tips: reparasjon er ofte billigere enn nytt.</text>
  <text x="22" y="510" class="u" font-size="11.5" font-weight="700" fill="#B4B6C4">Brukskonto</text>
  <text x="22" y="529" class="u" font-size="14" font-weight="800" fill="#F5F3EE">2 180 kr</text>
  <text x="111" y="510" class="u" font-size="11.5" font-weight="700" fill="#B4B6C4">Sparekonto</text>
  <text x="111" y="529" class="u" font-size="14" font-weight="800" fill="#F5F3EE">6 100 kr</text>
  <text x="200" y="510" class="u" font-size="11.5" font-weight="700" fill="#B4B6C4">Gjeld</text>
  <text x="200" y="529" class="u" font-size="14" font-weight="800" fill="#F5F3EE">0 kr</text>
  <text x="289" y="510" class="u" font-size="11.5" font-weight="700" fill="#B4B6C4">Faste</text>
  <text x="289" y="529" class="u" font-size="14" font-weight="800" fill="#F5F3EE">499 kr/mnd</text>
  <text x="22" y="568" class="u" font-size="16" font-weight="800" fill="#F5F3EE">Hva gjør du?</text>
  <text x="368" y="568" class="u" font-size="12" font-weight="700" fill="#8C8FA0" text-anchor="end">ett valg</text>
  <rect x="16" y="582" width="358" height="70" rx="20" fill="none" stroke="#2E3140" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="32" y="612" class="u" font-size="16" font-weight="800" fill="#8C8FA0">Kjøp ny toppmodell</text>
  <text x="32" y="634" class="u" font-size="12.5" font-weight="600" fill="#8C8FA0">Stress −4 · Sosialt +3</text>
  <text x="358" y="613" class="d" font-size="17" font-weight="400" fill="#8C8FA0" text-anchor="end">−8 990 kr</text>
  <use href="#i-lock" x="262" y="623" width="13" height="13" color="#FFB020"/><text x="358" y="634" class="u" font-size="11.5" font-weight="800" fill="#FFB020" text-anchor="end">Mangler 710 kr</text>
  <rect x="16" y="660" width="358" height="70" rx="20" fill="#181A22" stroke="#3A3E50" stroke-width="1"/>
  <text x="32" y="690" class="u" font-size="16" font-weight="800" fill="#F5F3EE">Bytt skjerm hos reparatør</text>
  <text x="32" y="712" class="u" font-size="12.5" font-weight="600" fill="#B4B6C4">Stress −2 · Sosialt ±0</text>
  <text x="358" y="691" class="d" font-size="17" font-weight="400" fill="#F5F3EE" text-anchor="end">−1 490 kr</text>
  <text x="358" y="712" class="u" font-size="11.5" font-weight="600" fill="#8C8FA0" text-anchor="end">betaler du nå</text>
  <rect x="16" y="738" width="358" height="70" rx="20" fill="#181A22" stroke="#3A3E50" stroke-width="1"/>
  <text x="32" y="768" class="u" font-size="16" font-weight="800" fill="#F5F3EE">Lev med sprekken en stund</text>
  <text x="32" y="790" class="u" font-size="12.5" font-weight="600" fill="#B4B6C4">Stress +3 · Sosialt −1</text>
  <text x="358" y="769" class="d" font-size="17" font-weight="400" fill="#C8FF2E" text-anchor="end">Gratis</text>
  <text x="358" y="790" class="u" font-size="11.5" font-weight="600" fill="#8C8FA0" text-anchor="end">0 kr</text>
  <text x="195" y="832" class="u" font-size="12" font-weight="600" fill="#8C8FA0" text-anchor="middle">Trykk på et valg. Du ser hva det gjør før neste måned.</text>
