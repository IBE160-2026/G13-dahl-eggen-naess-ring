  <circle cx="38" cy="86" r="20" fill="#0D0E13"/><text x="38" y="91.5" class="u" font-size="15" font-weight="800" fill="#FF4F8B" text-anchor="middle">M</text>
  <text x="68" y="82" class="u" font-size="15" font-weight="800" fill="#0D0E13">Mamma</text>
  <text x="68" y="99" class="u" font-size="12.5" font-weight="700" fill="#0D0E13">familie · hendelse i april</text>
  <circle cx="352" cy="86" r="22" fill="#0D0E13" fill-opacity="0.14"/><use href="#i-x" x="341" y="75" width="22" height="22" color="#0D0E13"/>
  <text x="22" y="162" class="d" font-size="44" font-weight="400" fill="#0D0E13" letter-spacing="-1.2">Skjermen</text>
  <text x="22" y="210" class="d" font-size="44" font-weight="400" fill="#0D0E13" letter-spacing="-1.2">er knust.</text>
  <text class="u" font-size="15" font-weight="600" fill="#0D0E13">
    <tspan x="22" y="250">Mobilen gled ut av lomma</tspan>
    <tspan x="22" y="271">i gangen. Den virker, men</tspan>
    <tspan x="22" y="292">sprekken går over halve</tspan>
    <tspan x="22" y="313">skjermen.</tspan>
  </text>
  <g transform="translate(6 6) rotate(12 306 300)">
    <rect x="258" y="226" width="96" height="168" rx="18" fill="#0D0E13"/>
