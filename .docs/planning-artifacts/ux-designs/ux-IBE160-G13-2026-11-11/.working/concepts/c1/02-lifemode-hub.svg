<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <title>LifeMode – månedshub (Story-feed)</title>
  <desc>Rommet: seng med rosa teppe, pult med skjerm, gamingstol, plakat, høyttaler på hylla. Ledig lag på hylla: mopedhjelm. Markus sitter på senga med mobilen.</desc>
  <defs>
    <style>
      .d{font-family:'Archivo Black','Arial Black',sans-serif}
      .u{font-family:'Schibsted Grotesk',system-ui,sans-serif}
    </style>
    <symbol id="i-echo" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h11M15 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H6M9 21l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 18.5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="6.5" y="12" width="4" height="4" rx="1" fill="currentColor"/><rect x="13.5" y="12" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 1.5"/></symbol>
    <symbol id="i-job" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12.5h18" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><path d="M4 20V13M10 20V8M16 20v-9M22 20H2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 9l6-5 6 4 5-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-year" viewBox="0 0 24 24"><path d="M3 8h4M9 8h4M15 8h6M3 16h8M13 16h8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="currentColor"/></symbol>
    <symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6.9c0 2-2.8 2.3-2.8 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <clipPath id="card"><rect x="16" y="124" width="358" height="360" rx="28"/></clipPath>
    <clipPath id="av"><circle cx="38" cy="86" r="19"/></clipPath>
    <linearGradient id="led" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4F8B" stop-opacity="0.32"/><stop offset="1" stop-color="#FF4F8B" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D0E13" stop-opacity="0"/><stop offset="0.45" stop-color="#0D0E13" stop-opacity="0.82"/><stop offset="1" stop-color="#0D0E13" stop-opacity="0.96"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F1A3D"/><stop offset="1" stop-color="#27305A"/></linearGradient>
  </defs>

  <rect width="390" height="844" fill="#0D0E13"/>

  <!-- status bar -->
  <text x="28" y="31" class="u" font-size="15" font-weight="700" fill="#F5F3EE">14:32</text>
  <g fill="#F5F3EE"><rect x="318" y="21" width="3" height="10" rx="1"/><rect x="323" y="18" width="3" height="13" rx="1"/><rect x="328" y="15" width="3" height="16" rx="1"/><rect x="339" y="17" width="24" height="13" rx="4" fill="none" stroke="#F5F3EE" stroke-width="1.5"/><rect x="341.5" y="19.5" width="16" height="8" rx="2"/></g>

  <!-- story ticks: one per month of this year, fat = highlight month -->
  <g aria-label="tidslinje for året"><rect x="16.00" y="48.0" width="27.08" height="8" rx="4" fill="#F5F3EE"/><rect x="46.08" y="50.0" width="27.08" height="4" rx="2" fill="#F5F3EE"/><rect x="76.17" y="50.0" width="27.08" height="4" rx="2" fill="#353847"/><rect x="76.17" y="50.0" width="14.90" height="4" rx="2" fill="#C8FF2E"/><rect x="106.25" y="48.0" width="27.08" height="8" rx="4" fill="#353847"/><rect x="136.33" y="50.0" width="27.08" height="4" rx="2" fill="#353847"/><rect x="166.42" y="50.0" width="27.08" height="4" rx="2" fill="#353847"/><rect x="196.50" y="50.0" width="27.08" height="4" rx="2" fill="#353847"/><rect x="226.58" y="48.0" width="27.08" height="8" rx="4" fill="#353847"/><rect x="256.67" y="50.0" width="27.08" height="4" rx="2" fill="#353847"/><rect x="286.75" y="50.0" width="27.08" height="4" rx="2" fill="#353847"/><rect x="316.83" y="48.0" width="27.08" height="8" rx="4" fill="#353847"/><rect x="346.92" y="50.0" width="27.08" height="4" rx="2" fill="#353847"/></g>

  <!-- header -->
  <circle cx="38" cy="86" r="23" fill="none" stroke="#C8FF2E" stroke-width="2.5"/>
  <g clip-path="url(#av)">
    <rect x="18" y="66" width="40" height="40" fill="#2E3140"/>
    <rect x="22" y="94" width="32" height="20" rx="10" fill="#C8FF2E"/>
    <circle cx="38" cy="84" r="9" fill="#C98B6B"/>
    <path d="M28.5 83c0-7 4-10 9.5-10s9.5 3 9.5 9c-3-3-7-3.5-11-2.5-3 .8-5.5 2-8 3.5z" fill="#1A1410"/>
  </g>
  <text x="70" y="92" class="d" font-size="26" fill="#F5F3EE" letter-spacing="-0.5">Mars</text>
  <text x="70" y="111" class="u" font-size="13" font-weight="600" fill="#B4B6C4">16 år · måned 15 av 60</text>
  <circle cx="306" cy="86" r="22" fill="#181A22"/>
  <use href="#i-year" x="295" y="75" width="22" height="22" color="#F5F3EE"/>
  <circle cx="352" cy="86" r="22" fill="#181A22"/>
  <use href="#i-menu" x="341" y="75" width="22" height="22" color="#F5F3EE"/>

  <!-- the month story: your room -->
  <g clip-path="url(#card)">
    <rect x="16" y="124" width="358" height="360" fill="#1D2130"/>
    <rect x="16" y="128" width="358" height="80" fill="url(#led)"/>
    <rect x="16" y="126" width="358" height="3" fill="#FF4F8B"/>
    <polygon points="16,348 374,348 374,484 16,484" fill="#24202E"/>
    <rect x="16" y="346" width="358" height="3" fill="#2E3140"/>
    <!-- window -->
    <rect x="34" y="176" width="88" height="96" rx="6" fill="url(#sky)" stroke="#3A3E50" stroke-width="4"/>
    <path d="M78 178v92M36 224h84" stroke="#3A3E50" stroke-width="3"/>
    <circle cx="102" cy="196" r="8" fill="#F5F3EE"/><circle cx="106" cy="193" r="7" fill="#132040"/>
    <circle cx="50" cy="192" r="1.3" fill="#F5F3EE"/><circle cx="62" cy="206" r="1" fill="#F5F3EE"/><circle cx="96" cy="246" r="1.2" fill="#F5F3EE"/>
    <!-- poster -->
    <rect x="140" y="166" width="58" height="80" rx="3" fill="#C8FF2E" transform="rotate(3 169 206)"/>
    <g transform="rotate(3 169 206)"><circle cx="169" cy="194" r="15" fill="#0D0E13"/><path d="M150 226h38M150 234h26" stroke="#0D0E13" stroke-width="4" stroke-linecap="round"/></g>
    <!-- shelf with layers -->
    <rect x="232" y="214" width="130" height="6" rx="2" fill="#3A3E50"/>
    <rect x="244" y="180" width="28" height="34" rx="5" fill="#0D0E13" stroke="#4A4E62" stroke-width="1.5"/>
    <circle cx="258" cy="190" r="4" fill="#2E3140"/><circle cx="258" cy="204" r="6.5" fill="#2E3140"/><circle cx="258" cy="204" r="2.5" fill="#FF4F8B"/>
    <rect x="282" y="198" width="18" height="16" rx="3" fill="#B4B6C4"/>
    <path d="M291 198c-6-6-9-13-6-17 4 2 6 8 6 17zM291 198c2-8 6-12 11-12-1 6-5 10-11 12z" fill="#7BC96F"/>
    <path d="M314 213c0-14 6-22 17-22s17 8 17 22z" fill="none" stroke="#8C8FA0" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="331" y="236" class="u" font-size="11" font-weight="700" fill="#B4B6C4" text-anchor="middle">mopedhjelm?</text>
    <!-- desk + screen + chair -->
    <rect x="58" y="240" width="76" height="48" rx="5" fill="#0D0E13" stroke="#3A3E50" stroke-width="3"/>
    <rect x="63" y="245" width="66" height="38" rx="2" fill="#C8FF2E" opacity="0.9"/>
    <path d="M68 274l12-10 10 6 14-14 18 10" fill="none" stroke="#0D0E13" stroke-width="3" stroke-linejoin="round"/>
    <rect x="93" y="288" width="6" height="6" fill="#3A3E50"/>
    <rect x="28" y="294" width="136" height="9" rx="2" fill="#3A3E50"/>
    <rect x="34" y="303" width="6" height="45" fill="#3A3E50"/><rect x="152" y="303" width="6" height="45" fill="#3A3E50"/>
    <rect x="132" y="262" width="40" height="62" rx="14" fill="#2E3140"/>
    <rect x="148" y="268" width="8" height="48" rx="4" fill="#C8FF2E"/>
    <rect x="124" y="318" width="56" height="12" rx="6" fill="#2E3140"/>
    <rect x="149" y="330" width="6" height="18" fill="#2E3140"/>
    <!-- bed -->
    <rect x="212" y="304" width="170" height="44" rx="6" fill="#3A3E50"/>
    <rect x="212" y="286" width="170" height="22" rx="8" fill="#E6E3DC"/>
    <rect x="218" y="270" width="44" height="20" rx="9" fill="#F5F3EE"/>
    <rect x="296" y="280" width="90" height="34" rx="10" fill="#FF4F8B"/>
    <path d="M300 296h80" stroke="#D93A72" stroke-width="2"/>
    <!-- avatar sitting on bed edge, on phone -->
    <g transform="translate(0 10)">
    <rect x="256" y="300" width="16" height="50" rx="7" fill="#3A3E50"/>
    <rect x="276" y="300" width="16" height="50" rx="7" fill="#3A3E50"/>
    <ellipse cx="262" cy="351" rx="11" ry="5" fill="#F5F3EE"/>
    <ellipse cx="286" cy="351" rx="11" ry="5" fill="#F5F3EE"/>
    <rect x="250" y="240" width="48" height="66" rx="18" fill="#C8FF2E"/>
    <path d="M262 244c4 6 20 6 24 0" fill="none" stroke="#8DB61C" stroke-width="2.5"/>
    <circle cx="274" cy="224" r="16" fill="#C98B6B"/>
    <path d="M258 222c0-12 7-17 16-17s16 5 16 15c-5-5-11-6-17-4-5 1.5-10 3.5-15 6z" fill="#1A1410"/>
    <rect x="266" y="270" width="16" height="22" rx="3" fill="#0D0E13"/>
    <rect x="268" y="272" width="12" height="16" rx="1.5" fill="#FF4F8B" opacity="0.85"/>
    <circle cx="265" cy="286" r="5" fill="#C98B6B"/><circle cx="283" cy="286" r="5" fill="#C98B6B"/>
    </g>
    <ellipse cx="200" cy="420" rx="150" ry="26" fill="#2E2A3A"/>
    <!-- caption overlay -->
    <rect x="16" y="356" width="358" height="128" fill="url(#fade)"/>
  </g>

  <rect x="30" y="140" width="122" height="30" rx="15" fill="#0D0E13" fill-opacity="0.78"/>
  <use href="#i-moon" x="40" y="147" width="16" height="16" color="#C8FF2E"/>
  <text x="62" y="160" class="u" font-size="13" font-weight="800" fill="#F5F3EE">Stille måned</text>

  <text x="32" y="400" class="u" font-size="16" font-weight="800" fill="#F5F3EE">Ingen hendelse. Lønna kom inn.</text>
  <g class="u" font-size="13" font-weight="800">
    <rect x="30" y="412" width="112" height="30" rx="15" fill="#0D0E13" stroke="#C8FF2E" stroke-width="1.4"/>
    <text x="86" y="432" fill="#C8FF2E" text-anchor="middle">+6 036 kr inn</text>
    <rect x="148" y="412" width="104" height="30" rx="15" fill="#0D0E13" stroke="#5A5E72" stroke-width="1.4"/>
    <text x="200" y="432" fill="#F5F3EE" text-anchor="middle">−3 517 kr ut</text>
    <rect x="258" y="412" width="100" height="30" rx="15" fill="#F5F3EE"/>
    <use href="#i-q" x="268" y="419" width="16" height="16" color="#0D0E13"/>
    <text x="320" y="432" fill="#0D0E13" text-anchor="middle">Hvorfor?</text>
  </g>
  <rect x="30" y="448" width="328" height="28" rx="14" fill="#FF4F8B"/>
  <use href="#i-echo" x="40" y="454" width="16" height="16" color="#0D0E13"/>
  <text x="62" y="467" class="u" font-size="12.5" font-weight="800" fill="#0D0E13">Ekko: +14 kr rente fordi du sparte i januar</text>

  <!-- balance + wellbeing -->
  <rect x="16" y="496" width="148" height="114" rx="20" fill="#181A22"/>
  <text x="30" y="519" class="u" font-size="12" font-weight="700" fill="#B4B6C4">Brukskonto</text>
  <text x="30" y="550" class="d" font-size="25" fill="#F5F3EE" letter-spacing="-0.5">2 180 kr</text>
  <text x="30" y="574" class="u" font-size="12" font-weight="600" fill="#B4B6C4">Sparekonto <tspan fill="#F5F3EE" font-weight="800">6 100 kr</tspan></text>
  <text x="30" y="593" class="u" font-size="12" font-weight="600" fill="#B4B6C4">Gjeld <tspan fill="#F5F3EE" font-weight="800">0 kr</tspan></text>

  <rect x="172" y="496" width="202" height="114" rx="20" fill="#181A22"/>
  <text x="186" y="519" class="u" font-size="12" font-weight="700" fill="#B4B6C4">Trivsel</text>
  <text x="360" y="519" class="u" font-size="11" font-weight="700" fill="#8C8FA0" text-anchor="end">grense for seier: 50</text>
  <text x="186" y="550" class="d" font-size="26" fill="#F5F3EE">64</text>
  <text x="225" y="550" class="u" font-size="12" font-weight="700" fill="#B4B6C4">/100 · over grensen</text>
  <g class="u" font-size="11" font-weight="700" fill="#F5F3EE">
    <text x="186" y="572">Stress 34 · lavt</text>
    <rect x="282" y="565" width="78" height="7" rx="3.5" fill="#2E3140"/><rect x="282" y="565" width="27" height="7" rx="3.5" fill="#FF4F8B"/>
    <text x="186" y="586">Fritid 72</text>
    <rect x="282" y="579" width="78" height="7" rx="3.5" fill="#2E3140"/><rect x="282" y="579" width="56" height="7" rx="3.5" fill="#C8FF2E"/>
    <text x="186" y="600">Sosialt 58</text>
    <rect x="282" y="593" width="78" height="7" rx="3.5" fill="#2E3140"/><rect x="282" y="593" width="45" height="7" rx="3.5" fill="#F5F3EE"/>
  </g>

  <!-- entry points as highlight bubbles -->
  <g class="u" text-anchor="middle">
    <circle cx="61" cy="656" r="33" fill="none" stroke="#C8FF2E" stroke-width="2.5"/>
    <circle cx="61" cy="656" r="28" fill="#181A22"/>
    <use href="#i-phone" x="48" y="643" width="26" height="26" color="#F5F3EE"/>
    <rect x="76" y="622" width="26" height="20" rx="10" fill="#FF4F8B"/>
    <text x="89" y="636.5" font-size="12" font-weight="800" fill="#0D0E13">2</text>
    <text x="61" y="707" font-size="13" font-weight="800" fill="#F5F3EE">Telefon</text>
    <text x="61" y="723" font-size="11.5" font-weight="600" fill="#B4B6C4">2 nye</text>

    <circle cx="150" cy="656" r="33" fill="none" stroke="#353847" stroke-width="2"/>
    <circle cx="150" cy="656" r="28" fill="#181A22"/>
    <use href="#i-plan" x="137" y="643" width="26" height="26" color="#F5F3EE"/>
    <text x="150" y="707" font-size="13" font-weight="800" fill="#F5F3EE">Månedsplan</text>
    <text x="150" y="723" font-size="11.5" font-weight="600" fill="#B4B6C4">0 av 4 plasser</text>

    <circle cx="240" cy="656" r="33" fill="none" stroke="#353847" stroke-width="2"/>
    <circle cx="240" cy="656" r="28" fill="#181A22"/>
    <use href="#i-job" x="227" y="643" width="26" height="26" color="#F5F3EE"/>
    <text x="240" y="707" font-size="13" font-weight="800" fill="#F5F3EE">Jobb</text>
    <text x="240" y="723" font-size="11.5" font-weight="600" fill="#B4B6C4">10 t/uke</text>

    <circle cx="329" cy="656" r="33" fill="none" stroke="#353847" stroke-width="2"/>
    <circle cx="329" cy="656" r="28" fill="#181A22"/>
    <use href="#i-money" x="316" y="643" width="26" height="26" color="#F5F3EE"/>
    <text x="329" y="707" font-size="13" font-weight="800" fill="#F5F3EE">Penger</text>
    <text x="329" y="723" font-size="11.5" font-weight="600" fill="#B4B6C4">72 % av målet</text>
  </g>

  <!-- continue -->
  <rect x="16" y="746" width="358" height="58" rx="29" fill="#C8FF2E"/>
  <text x="181" y="781" class="u" font-size="17" font-weight="800" fill="#0D0E13" text-anchor="middle">Fortsett til april</text>
  <use href="#i-arrow" x="268" y="764" width="22" height="22" color="#0D0E13"/>
  <text x="195" y="828" class="u" font-size="12.5" font-weight="600" fill="#8C8FA0" text-anchor="middle">Ett trykk holder. Tomme plasser er helt greit.</text>
</svg>
