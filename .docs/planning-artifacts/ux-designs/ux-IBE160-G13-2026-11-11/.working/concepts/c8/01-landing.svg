<rect x="157.5" y="318" width="5" height="10" fill="#1F4FD8"/>
<rect x="157.5" y="356" width="5" height="10" fill="#007A52"/>

<!-- stations -->
<circle cx="32" cy="330" r="9" fill="#fff" stroke="#111" stroke-width="3.5"/>
<rect x="88" y="321" width="16" height="42" rx="8" fill="#fff" stroke="#111" stroke-width="3.5"/>
<circle cx="224" cy="330" r="9" fill="#fff" stroke="#111" stroke-width="3.5"/>
<circle cx="288" cy="330" r="9" fill="#fff" stroke="#111" stroke-width="3.5"/>
<rect x="344" y="287" width="16" height="110" rx="8" fill="#fff" stroke="#111" stroke-width="3.5"/>

