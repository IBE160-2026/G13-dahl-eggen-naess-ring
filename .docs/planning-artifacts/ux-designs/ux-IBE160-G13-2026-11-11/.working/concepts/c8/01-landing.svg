<text x="20" y="514" class="m mut" font-size="10.5">60 MÅNEDER</text>
<text x="370" y="514" class="m mut" font-size="10.5" text-anchor="end">ÉN ØKT = ETT ÅR · 10–15 MIN</text>

<!-- body -->
<text class="g" font-size="15.5" fill="#222">
<tspan x="20" y="552">Et spill om penger og livet fra 15 til 20.</tspan>
<tspan x="20" y="574">Hvert valg sender deg inn på et nytt spor –</tspan>
<tspan x="20" y="596">og spillet viser alltid hvorfor du havnet der.</tspan>
</text>
<text x="20" y="624" class="m mut" font-size="10.5">136,41 KR/T · BSU · FRIKORT · EKTE TALL</text>

