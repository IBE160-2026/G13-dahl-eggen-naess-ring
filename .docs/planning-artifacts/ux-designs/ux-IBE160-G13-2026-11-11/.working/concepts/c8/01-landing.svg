<text x="32" y="277">15</text><text x="96" y="277">16</text><text x="160" y="277">17</text><text x="224" y="277">18</text><text x="288" y="277">19</text><text x="352" y="277">20</text>
</g>

<!-- echo loop (dashed, behind) -->
<path d="M60 358 C 60 468, 288 468, 288 344" fill="none" stroke="#007A52" stroke-width="3" stroke-dasharray="6 5"/>
