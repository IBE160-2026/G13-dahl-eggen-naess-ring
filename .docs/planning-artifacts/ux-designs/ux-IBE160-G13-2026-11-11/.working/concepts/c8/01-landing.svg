<path d="M26 77 L33 70 L40 70" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="26" cy="77" r="3" fill="#fff"/>
<text x="54" y="77" class="g b" font-size="19" letter-spacing="-0.3">LifeMode</text>
<text x="370" y="76" class="m mut" font-size="11" text-anchor="end">15 → 20 ÅR</text>
<line x1="20" y1="100" x2="370" y2="100" stroke="#111" stroke-width="1"/>

<!-- headline -->
<text class="g xb" font-size="41" letter-spacing="-1.4">
<tspan x="18" y="146">Fem år.</tspan>
<tspan x="18" y="190">Seksti stopp.</tspan>
<tspan x="18" y="234" fill="#1F4FD8">Du velger sporet.</tspan>
</text>

