<text x="132" y="376" class="g b" font-size="11" fill="#006644">Sparelinja · pengegaven</text>
<text x="136" y="410" class="g b" font-size="11">Mopedlinja · fra 16</text>
<text x="20" y="378" class="g b" font-size="12">Du</text>
<text x="20" y="392" class="g mut" font-size="11">i dag</text>
<text x="174" y="458" class="g" font-size="11" fill="#006644" text-anchor="middle">ekko: valget ditt kommer tilbake</text>

