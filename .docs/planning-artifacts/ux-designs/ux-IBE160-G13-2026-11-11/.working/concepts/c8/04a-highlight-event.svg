<text x="20" y="704" class="g b k" font-size="12.5">Tips</text>
<text x="52" y="704" class="g k" font-size="12.5">Sjekk hva som er igjen etter faste utgifter</text>
<text x="52" y="722" class="g k" font-size="12.5">før du sier ja. Du kan ignorere tipset.</text>
<text x="20" y="772" class="g mut" font-size="12">Tallene regnes av spillet. Ingen av sporene er «feil».</text>
