<text x="20" y="238" class="g xb k" font-size="23" letter-spacing="-0.5">Hyttetur i påsken?</text>
<text class="g k" font-size="15"><tspan x="20" y="264">«Vi har leid en hytte på fjellet fra skjær-</tspan><tspan x="20" y="285">torsdag til søndag. 1 200 kr per person for</tspan><tspan x="20" y="306">leie, mat og buss. Blir du med?»</tspan></text>
