<text x="370" y="85" class="m mut" font-size="11" text-anchor="end">MÅNED 15</text>
<text x="20" y="122" class="g b k" font-size="14">Kom i mars</text>
<text x="370" y="122" class="m mut" font-size="10.5" text-anchor="end">3 NYE</text>
<line x1="20" y1="132" x2="370" y2="132" stroke="#111" stroke-width="1.5"/>
<rect x="20" y="133" width="350" height="238" fill="#F3F5FC"/><rect x="20" y="144" width="36" height="36" rx="4" fill="#1F4FD8"/><text x="38" y="168" class="g b" font-size="16" fill="#fff" text-anchor="middle" style="fill:#fff">E</text><text x="66" y="159" class="g b k" font-size="15">Emma</text><text x="66" y="176" class="g mut" font-size="11.5">Venn</text><rect x="296.6" y="146.6" width="72.8" height="15.8" fill="none" stroke="#111" stroke-width="1.2"/><text x="333.0" y="158.5" class="m b k" font-size="9.5" text-anchor="middle">INVITASJON</text><rect x="265.6" y="146" width="24.4" height="17" fill="#111"/><text x="277.8" y="158.5" class="m b w" font-size="9.5" text-anchor="middle">NY</text><text class="g k" font-size="14.5"><tspan x="66" y="194">«Konsert i byen fredag! Har en billett</tspan><tspan x="66" y="213">til overs, 450 kr. Blir du med?»</tspan></text>
<rect x="66" y="226" width="292" height="70" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
<rect x="78" y="238" width="22" height="22" rx="3" fill="#1F4FD8"/><rect x="84" y="244" width="10" height="10" fill="#fff"/>
<text x="110" y="250" class="g b k" font-size="14">Konsert med Emma</text>
<text x="346" y="250" class="m b k" font-size="13" text-anchor="end">450 kr</text>
<text x="110" y="269" class="g k" font-size="12">Sosialt +8 · Stress −2</text>
<text x="110" y="285" class="g mut" font-size="11.5">Bruker 1 av 4 plasser</text>
<rect x="66" y="306" width="292" height="46" rx="4" fill="#111"/>
<path d="M82 329 H94 M88 323 V335" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="104" y="334" class="g b w" font-size="15">Legg i månedsplan</text>
<text x="66" y="366" class="g mut" font-size="11.5">Invitasjonen gjelder bare i mars.</text>
<line x1="20" y1="371" x2="370" y2="371" stroke="#DADADA"/>
<rect x="20" y="383" width="36" height="36" rx="4" fill="#F2A900"/><text x="38" y="407" class="g b" font-size="16" fill="#111" text-anchor="middle" style="fill:#111">B</text><text x="66" y="398" class="g b k" font-size="15">Banken</text><text x="123.6" y="398" class="g mut" font-size="11.5">Bank</text><rect x="333.8" y="385.6" width="35.599999999999994" height="15.8" fill="none" stroke="#111" stroke-width="1.2"/><text x="351.59999999999997" y="397.5" class="m b k" font-size="9.5" text-anchor="middle">INFO</text><rect x="302.8" y="385" width="24.4" height="17" fill="#111"/><text x="315.0" y="397.5" class="m b w" font-size="9.5" text-anchor="middle">NY</text><text x="66" y="418" class="g k" font-size="12.5">Sparekontoen har tjent 52 kr i rente så langt.</text><line x1="20" y1="431" x2="370" y2="431" stroke="#DADADA"/><rect x="20" y="443" width="36" height="36" rx="4" fill="#111"/><text x="38" y="467" class="g b" font-size="16" fill="#fff" text-anchor="middle" style="fill:#fff">J</text><text x="66" y="458" class="g b k" font-size="15">Butikken</text><text x="140.8" y="458" class="g mut" font-size="11.5">Jobb</text><rect x="321.40000000000003" y="445.6" width="48.0" height="15.8" fill="none" stroke="#111" stroke-width="1.2"/><text x="345.40000000000003" y="457.5" class="m b k" font-size="9.5" text-anchor="middle">TILBUD</text><rect x="290.40000000000003" y="445" width="24.4" height="17" fill="#111"/><text x="302.6" y="457.5" class="m b w" font-size="9.5" text-anchor="middle">NY</text><text x="66" y="478" class="g k" font-size="12.5">Vil du ta ekstravakter april–juni?</text><line x1="20" y1="491" x2="370" y2="491" stroke="#DADADA"/><text x="20" y="524" class="g b k" font-size="14">Tidligere</text>
<line x1="20" y1="534" x2="370" y2="534" stroke="#111" stroke-width="1.5"/>
<rect x="20" y="546" width="36" height="36" rx="4" fill="#fff" stroke="#111" stroke-width="1.5"/><circle cx="38" cy="564" r="8" fill="#fff" stroke="#111" stroke-width="3.2"/><text x="66" y="561" class="g b k" font-size="15">Lina</text><text x="110" y="561" class="g mut" font-size="11.5">Venn · februar</text><rect x="309.0" y="548.6" width="60.4" height="15.8" fill="none" stroke="#111" stroke-width="1.2"/><text x="339.2" y="560.5" class="m b k" font-size="9.5" text-anchor="middle">HENDELSE</text><text x="66" y="581" class="g k" font-size="12.5">Kopi: «Den jakka er på salg nå – 900 kr!»</text><line x1="20" y1="594" x2="370" y2="594" stroke="#DADADA"/><rect x="20" y="606" width="36" height="36" rx="4" fill="#007A52"/><text x="38" y="630" class="g b" font-size="16" fill="#fff" text-anchor="middle" style="fill:#fff">M</text><text x="66" y="621" class="g b mut" font-size="15">Mamma</text><text x="130.0" y="621" class="g mut" font-size="11.5">Familie · januar</text><rect x="320.8" y="608" width="49.2" height="17" fill="url(#hatch)" opacity=".2"/><rect x="321.40000000000003" y="608.6" width="48.0" height="15.8" fill="none" stroke="#C21F12" stroke-width="1.2"/><text x="345.40000000000003" y="620.5" class="m b red" font-size="9.5" text-anchor="middle">UTLØPT</text><text x="66" y="641" class="g mut" font-size="12.5" text-decoration="line-through">Brukt moped fra onkel – 6 000 kr</text><line x1="20" y1="654" x2="370" y2="654" stroke="#DADADA"/><text x="66" y="657" class="g mut" font-size="11">Tilbudet gjaldt bare i januar.</text><rect x="20" y="680" width="36" height="36" rx="4" fill="#F2A900"/><text x="38" y="704" class="g b" font-size="16" fill="#111" text-anchor="middle" style="fill:#111">B</text><text x="66" y="695" class="g b k" font-size="15">Banken</text><text x="123.6" y="695" class="g mut" font-size="11.5">Bank · januar</text><rect x="333.8" y="682.6" width="35.599999999999994" height="15.8" fill="none" stroke="#111" stroke-width="1.2"/><text x="351.59999999999997" y="694.5" class="m b k" font-size="9.5" text-anchor="middle">INFO</text><text x="66" y="715" class="g k" font-size="12.5">Du har nådd halvparten av sparemålet ditt.</text><line x1="20" y1="728" x2="370" y2="728" stroke="#DADADA"/><text x="20" y="770" class="g mut" font-size="12">Du svarer ikke på meldinger – du svarer med det du</text>
<text x="20" y="787" class="g mut" font-size="12">gjør: legger i planen, tar tilbudet eller lar det være.</text>
