<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
<title>LifeMode – Kortstokk: Hendelse</title>
<desc>Hendelse i februar fra Pappa: PC-en streiker. Ekko fra gaming-PC kjøpt for pengegaven i måned 1. Tre handlingskort: A lever på verksted −1 800 kr, stress −2; B fiks den med Jonas −350 kr, stress +2, sosialt +3 (valgt); C spill på mobilen, gratis, stress +3, sosialt −2.</desc>
