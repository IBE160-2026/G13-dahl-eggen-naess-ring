3"/></g><text x="298" y="184" class="u" font-size="12" font-weight="700" fill="#555B6E" >Trivsel</text><text x="298" y="218" class="d" font-size="26" font-weight="800" fill="#141A2E" >68</text><text x="298" y="240" class="u" font-size="11.5" font-weight="700" fill="#356534" >opp fra 64</text><path d="M32 268H360L374 282V332Q374 348 358 348H32Q16 348 16 332V284Q16 268 32 268Z" fill="#F6E6BC" /><path d="M360 268V277Q360 282 365 282H374Z" fill="#8A6514" fill-opacity="0.25"/><path d="M37.6 280H51.36L60 288.64V302.4Q60 312 50.4 312H37.6Q28 312 28 302.4V289.6Q28 280 37.6 280Z" fill="#E7B84E" /><path d="M51.36 280V283.64Q51.36 288.64 56.36 288.64H60Z" fill="#000" fill-opacity="0.22"/><use href="#i-echo" transform="translate(35.04 287.68) scale(0.7466666666666667)" stroke="#141A2E"/><text x="72" y="292" class="u" font-size="13" font-weight="800" fill="#141A2E" >Minne · oktober i fjor</text><text x="72" y="310" class="u" font-size="12" font-weight="500" fill="#141A2E" >Du gikk på bursdagen til Emma. Derfor deler</text><text x="72" y="326" class="u" font-size="12" font-weight="500" fill="#141A2E" >dere rom på turen – sosialt +3.</text><text x="72" y="342" class="u" font-size="12" font-weight="700" fill="#141A2E" text-decoration="underline">Se valget</text><rect x="16" y="360" width="175" height="82" rx="16" fill="#FFFFFF" stroke="#D3C8B3"/><use href="#i-key" transform="translate(28 372) scale(0.75)" stroke="#356534" stroke-width="2.4"/><text x="52" y="386" class="u" font-size="12.5" font-weight="800" fill="#356534" >Åpnet</text><text x="28" y="408" class="u" font-size="13.5" font-weight="700" fill="#141A2E" >Berlin-plakaten</text><text x="28" y="426" class="u" font-size="12" font-weight="500" fill="#555B6E" >henger nå i rommet ditt</text><rect x="199" y="360" width="175" height="82" rx="16" fill="#FFFFFF" stroke="#D3C8B3"/><use href="#i-lock" transform="translate(211 372) scale(0.75)" stroke="#AE2439" stroke-width="2.4"/><text x="235" y="386" class="u" font-size="12.5" font-weight="800" fill="#AE2439" >Lukket</text><text x="211" y="408" class="u" font-size="13.5" font-weight="700" fill="#141A2E" >Mopedlappen i april</text><text x="211" y="426" class="u" font-size="12" font-weight="700" fill="#AE2439" >mangler nå 3 192 kr</text><use href="#i-swap" transform="translate(16 454) scale(0.75)" stroke="#555B6E" stroke-width="2.2"/><text x="40" y="467" class="u" font-size="12.5" font-weight="600" fill="#141A2E" >Hvis du hadde stått over: 3 500 kr mer på</text><text x="40" y="484" class="u" font-size="12.5" font-weight="600" fill="#141A2E" >konto og lappen i april – men sosialt −6.</text><path d="M0 526Q0 502 24 502H366Q390 502 390 526V844H0Z" fill="#141A2E"/><use href="#rose" transform="translate(195 516) scale(0.12)" fill="#F4EFE6" fill-opacity="0.5" /><use href="#i-why" transform="translate(16 536) scale(1.0)" stroke="#F08A3C" stroke-width="2.2"/><text x="48" y="556" class="d" font-size="21" font-weight="800" fill="#F4EFE6" >Hvorfor? Trivsel +4</text><text x="16" y="580" class="u" font-size="12.5" font-weight="500" fill="#F4EFE6" fill-opacity="0.75">Ly viser hva som flyttet tallet – og hvor mye</text><path d="M16 596H374" stroke="#F4EFE6" stroke-opacity="0.15"/><text x="16" y="619" class="u" font-size="14" font-weight="700" fill="#F4EFE6" >Klasseturen</text><text x="16" y="637" class="u" font-size="12" font-weight="500" fill="#F4EFE6" fill-opacity="0.72">sosialt +5 · valgt i mars</text><text x="374" y="627" class="u" font-size="14" font-weight="800" fill="#A5DFA6" text-anchor="end" >+2 trivsel</text><path d="M16 646H374" stroke="#F4EFE6" stroke-opacity="0.15"/><use href="#i-echo" transform="translate(16 656) scale(0.6666666666666666)" stroke="#E7B84E" stroke-width="2.4"/><text x="38" y="669" class="u" font-size="14" font-weight="700" fill="#F4EFE6" >Minne: Emmas bursdag</text><text x="16" y="687" class="u" font-size="12" font-weight="500" fill="#F4EFE6" fill-opacity="0.72">sosialt +3 · valgt i oktober i fjor</text><text x="374" y="677" class=