<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeMode, alle skjermer</title>
<style>
:root{--ink:#1A1C2A;--muted:#454656;--paper:#F6F3EC;--wall:#DCE6D2;--coral:#FF6F59;--z:.72}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#A3AF9C;color:var(--ink);font-family:'Bricolage Grotesque',ui-sans-serif,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;border-bottom:1px solid #DDD8CC}
h1{font-size:20px;letter-spacing:-.015em}
h2{font-size:24px;letter-spacing:-.015em;margin:48px 0 16px;scroll-margin-top:72px}
h3{font-size:15px;margin-bottom:8px;display:flex;gap:12px;align-items:baseline}
h3 a{font-size:13px;font-weight:600;color:var(--ink);text-underline-offset:3px}
fieldset{border:0;display:flex;gap:4px;background:#E8E4DA;border-radius:999px;padding:4px}
label{cursor:pointer;font-weight:700;font-size:14px}
label span{display:block;padding:8px 16px;border-radius:999px;color:var(--muted)}
input{position:absolute;opacity:0}
input:checked+span{background:var(--ink);color:var(--paper)}
input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
nav{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;font-weight:600}
nav a{color:var(--ink);text-underline-offset:3px;padding:6px 0}
main{padding:0 24px 64px}
.grid{display:flex;flex-wrap:wrap;gap:32px 24px;align-items:flex-start}
.fr{overflow:hidden;border-radius:16px;background:var(--wall);box-shadow:0 6px 18px rgba(26,28,42,.14)}
iframe{border:0;transform:scale(var(--z));transform-origin:0 0;display:block}
.leg{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body>
<header><h1>Alle skjermer</h1>
<fieldset><legend class="leg">Bredde</legend><label><input type="radio" name="w" value="0" checked><span>Mobil</span></label><label><input type="radio" name="w" value="1"><span>Nettbrett</span></label><label><input type="radio" name="w" value="2"><span>Desktop</span></label></fieldset>
<fieldset><legend class="leg">Høyde</legend><label><input type="radio" name="h" value="full" checked><span>Hele siden</span></label><label><input type="radio" name="h" value="view"><span>Skjermhøyde</span></label></fieldset>
<nav aria-label="Grupper" id="nav"></nav></header><main id="m"></main>
<script>
const D=[["Start", [["landing", "01 Første skjerm", [856, 1368, 900]], ["opprett", "02 Lag bruker", [1128, 1096, 900]], ["opprett~sjekk", "02 Sjekk e-posten", [844, 900, 900]], ["opprett~ibruk", "02 E-posten er i bruk", [1128, 1096, 900]], ["logginn", "03 Logg inn", [844, 900, 900]], ["glemt", "04 Glemt passord", [844, 900, 900]], ["glemt~sendt", "04 Lenke sendt", [844, 900, 900]], ["start", "05–06 Livsmål og utseende", [1098, 1103, 900]], ["gave", "07 Pengegave", [955, 968, 918]], ["resultat~g_spar", "13 Resultat: sparte alt", [1052, 1031, 981]], ["velkommen", "24 Velkommen tilbake", [1092, 1115, 1065]]]], ["Måneden", [["hjem~vis", "08 Hjem", [1232, 1194, 1144]], ["hjem~varsel", "09 Meldingsvarsel", [1232, 1194, 1144]], ["hjem~rente", "08 Rente forklart", [844, 900, 900]], ["hjem~trivsel", "08 Trivselsmålet forklart", [844, 900, 900]], ["hjem~flytt", "08 Hva gikk pengene til, med overføring", [1645, 1588, 1538]], ["plan", "15 Plan", [895, 900, 900]], ["plan~velg", "15 Legg til (ark)", [844, 900, 900]], ["plan~full", "15 Plan, alt fylt", [844, 900, 900]], ["plan~forste", "15 Første plan, med forklaring", [1138, 1037, 1057]], ["aar", "19 Året", [1424, 1242, 1242]]]], ["Mobil, jobb og bank", [["telefon", "10 Meldinger", [844, 900, 1144]], ["melding", "11 Samtale", [844, 900, 1144]], ["jobb", "16 Jobb", [1410, 1326, 1144]], ["jobb~svart", "16 Jobb, svart og spurt", [1292, 1187, 1144]], ["penger", "17 Banken", [2003, 1907, 1144]], ["penger~selg", "17 Selg mopeden", [844, 900, 900]], ["penger~solgt", "17 Mopeden solgt", [2003, 1907, 1144]], ["penger~18", "17 Banken fra 18 år", [2048, 1969, 1202]], ["penger~fast", "17 Kortregning med fast beløp", [2100, 2021, 1202]], ["penger~laan", "17 Forbrukslån", [844, 900, 900]], ["hjem~solgt", "08 Hjem uten moped", [1232, 1194, 1144]]]], ["Hendelser", [["hendelse", "12 Hendelse (oktober)", [1083, 1037, 987]], ["resultat~repair", "13 Resultat: reparert, med Hvorfor?", [1357, 1370, 1320]], ["resultat~used", "13 Resultat: brukt mobil", [976, 1031, 981]], ["resultat~live", "13 Resultat: sprukket", [976, 1031, 981]], ["kort", "20 Kortvarsel", [1353, 1274, 1224]], ["kort~minste", "20 Det minste forklart", [844, 900, 900]], ["resultat~k_av", "13 Resultat: kortet av", [976, 1031, 981]], ["krise", "21 Krise, valg 1", [1285, 1184, 1134]], ["krise~2", "21 Krise, valg 2", [1144, 1100, 1050]], ["krise~loest", "21 Krise løst", [906, 961, 911]], ["krise~ikke", "21 Krise ikke løst", [872, 927, 900]]]], ["Årsslutt og slutt", [["aarsslutt", "23 Desember og årsslutt", [1258, 1189, 1139]], ["aarsslutt~droppet", "23 Desember med aktivitet som falt bort", [1400, 1300, 1250]], ["penger~m59", "17 Måned 59: krise i desember", [2164, 2044, 1244]], ["hjem~m60", "08 Måned 60: advarsel", [1393, 1294, 1244]], ["hjem~m60s", "08 Måned 60: bekreft at du fortsetter", [844, 900, 900]], ["slutt", "25 Ekte seier", [1163, 1166, 1116]], ["slutt-hul", "25 Hul seier", [1239, 1166, 1116]], ["slutt-ikke", "25 Målet ikke nådd", [1244, 1191, 1141]], ["slutt-tap", "25 Tap", [1187, 1166, 1116]]]], ["Meny og tilstander", [["meny", "26 Meny", [844, 900, 900]], ["meny~slett", "26 Slett bruker", [844, 900, 900]], ["meny~info", "26 Dette lagrer vi", [844, 900, 900]], ["tallene", "27 Om tallene", [844, 900, 900]], ["offline", "28 Ingen nett", [1311, 1251, 1201]]]]];
const W=[390,820,1280],Z=[.72,.55,.5],VH=[844,1100,900];
let w=0,full=true;
function draw(){const z=Z[w];document.documentElement.style.setProperty('--z',z);
 m.innerHTML=D.map(([g,l],i)=>`<section><h2 id="g${i}">${g}</h2><div class="grid">${l.filter(([r])=>w<2||!['plan~velg','hjem~varsel'].includes(r)).map(([r,t,h])=>{const H=full?h[w]:VH[w];return `<div><h3>${t}<a href="index.html#${r}" target="_blank" rel="noopener">Åpne</a></h3><div class="fr" style="width:${W[w]*z}px;height:${H*z}px"><iframe loading="lazy" title="${t}" src="index.html#${r}" width="${W[w]}" height="${H}"></iframe></div></div>`}).join('')}</div></section>`).join('')}
nav.innerHTML=D.map(([g],i)=>`<a href="#g${i}">${g}</a>`).join('');
document.addEventListener('change',e=>{if(e.target.name==='w')w=+e.target.value;if(e.target.name==='h')full=e.target.value==='full';draw()});
draw();
</script></body></html>
