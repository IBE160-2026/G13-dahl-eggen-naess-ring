  <title id="t">Basen: Turen din: År 1 til 5</title>
  <desc id="d">Hele fjellet med fem leirer, én per år. Ved hver leir står årets tolv måneder: År 1 er fullført, i År 2 er januar til april spilt, og april er markert. Toppen er livsmålet.</desc>
