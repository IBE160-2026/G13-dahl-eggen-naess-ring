<text x="20" y="186" font-family="'Schibsted Grotesk', sans-serif" font-size="13" font-weight="500" fill="#4D5F63" text-anchor="start" >Målet står på taket av blokka og sjekkes når du fyller 20.</text>
<text x="20" y="204" font-family="'Schibsted Grotesk', sans-serif" font-size="13" font-weight="500" fill="#4D5F63" text-anchor="start" >Du kan ikke bytte underveis.</text>
