<text x="78" y="260" font-family="'Schibsted Grotesk', sans-serif" font-size="18" font-weight="900" fill="#18262B" text-anchor="start" >Spar til noe stort</text><text x="38" y="300" font-family="'Schibsted Grotesk', sans-serif" font-size="13.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Minst 100 000 kr spart når du fyller 20.</text><text x="38" y="320" font-family="'Schibsted Grotesk', sans-serif" font-size="13.5" font-weight="500" fill="#4D5F63" text-anchor="start" >For eksempel en start på egen leilighet.</text>
