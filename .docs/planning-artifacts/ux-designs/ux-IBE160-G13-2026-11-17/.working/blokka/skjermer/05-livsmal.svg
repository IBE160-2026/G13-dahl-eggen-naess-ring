<text x="78" y="516" font-family="'Schibsted Grotesk', sans-serif" font-size="18" font-weight="900" fill="#18262B" text-anchor="start" >Råd til en stor opplevelse</text><text x="38" y="556" font-family="'Schibsted Grotesk', sans-serif" font-size="13.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Åtte uker Interrail for 60 000 kr, uten lån,</text><text x="38" y="576" font-family="'Schibsted Grotesk', sans-serif" font-size="13.5" font-weight="500" fill="#4D5F63" text-anchor="start" >innen august det siste året.</text>
