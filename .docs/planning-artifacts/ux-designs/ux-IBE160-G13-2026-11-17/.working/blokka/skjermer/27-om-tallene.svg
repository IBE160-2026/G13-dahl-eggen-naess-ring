<text x="20" y="186" font-family="'Schibsted Grotesk', sans-serif" font-size="13.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Spillet bruker ekte norske tall fra 2026, men</text>
<text x="20" y="205" font-family="'Schibsted Grotesk', sans-serif" font-size="13.5" font-weight="500" fill="#4D5F63" text-anchor="start" >forenkler noen ting. Her står alt samlet.</text>
<rect x="20" y="226" width="350" height="74" rx="10" fill="#fff" stroke="#C3D2CD" stroke-width="1.5"/>
<circle cx="44" cy="253" r="11" fill="none" stroke="#1E5A6B" stroke-width="2"/><text x="44" y="258" font-family="'Schibsted Grotesk', sans-serif" font-size="13" font-weight="900" fill="#1E5A6B" text-anchor="middle" >i</text>
<text x="66" y="258" font-family="'Schibsted Grotesk', sans-serif" font-size="15.5" font-weight="800" fill="#18262B" text-anchor="start" >Lønn</text><text x="38" y="283" font-family="'Schibsted Grotesk', sans-serif" font-size="12.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Alle jobber gir samme timelønn for alderen.</text>
<rect x="20" y="312" width="350" height="74" rx="10" fill="#fff" stroke="#C3D2CD" stroke-width="1.5"/>
<circle cx="44" cy="339" r="11" fill="none" stroke="#1E5A6B" stroke-width="2"/><text x="44" y="344" font-family="'Schibsted Grotesk', sans-serif" font-size="13" font-weight="900" fill="#1E5A6B" text-anchor="middle" >i</text>
<text x="66" y="344" font-family="'Schibsted Grotesk', sans-serif" font-size="15.5" font-weight="800" fill="#18262B" text-anchor="start" >Skatt</text><text x="38" y="369" font-family="'Schibsted Grotesk', sans-serif" font-size="12.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Skatt regnes på årslønna, uten andre fradrag.</text>
<rect x="20" y="398" width="350" height="74" rx="10" fill="#fff" stroke="#C3D2CD" stroke-width="1.5"/>
<circle cx="44" cy="425" r="11" fill="none" stroke="#1E5A6B" stroke-width="2"/><text x="44" y="430" font-family="'Schibsted Grotesk', sans-serif" font-size="13" font-weight="900" fill="#1E5A6B" text-anchor="middle" >i</text>
<text x="66" y="430" font-family="'Schibsted Grotesk', sans-serif" font-size="15.5" font-weight="800" fill="#18262B" text-anchor="start" >Renter</text><text x="38" y="455" font-family="'Schibsted Grotesk', sans-serif" font-size="12.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Renter regnes én gang i måneden, i hele kroner.</text>
<rect x="20" y="484" width="350" height="74" rx="10" fill="#fff" stroke="#C3D2CD" stroke-width="1.5"/>
<circle cx="44" cy="511" r="11" fill="none" stroke="#1E5A6B" stroke-width="2"/><text x="44" y="516" font-family="'Schibsted Grotesk', sans-serif" font-size="13" font-weight="900" fill="#1E5A6B" text-anchor="middle" >i</text>
<text x="66" y="516" font-family="'Schibsted Grotesk', sans-serif" font-size="15.5" font-weight="800" fill="#18262B" text-anchor="start" >Kveldene</text><text x="38" y="541" font-family="'Schibsted Grotesk', sans-serif" font-size="12.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Måneden har ledige kvelder, ikke dager.</text>
<rect x="20" y="570" width="350" height="74" rx="10" fill="#fff" stroke="#C3D2CD" stroke-width="1.5"/>
<circle cx="44" cy="597" r="11" fill="none" stroke="#1E5A6B" stroke-width="2"/><text x="44" y="602" font-family="'Schibsted Grotesk', sans-serif" font-size="13" font-weight="900" fill="#1E5A6B" text-anchor="middle" >i</text>
<text x="66" y="602" font-family="'Schibsted Grotesk', sans-serif" font-size="15.5" font-weight="800" fill="#18262B" text-anchor="start" >Mopeden</text><text x="38" y="627" font-family="'Schibsted Grotesk', sans-serif" font-size="12.5" font-weight="500" fill="#4D5F63" text-anchor="start" >Verdien faller litt hver måned, uansett kjøring.</text>
<text x="195" y="680" font-family="'Schibsted Grotesk', sans-serif" font-size="12.5" font-weight="500" fill="#4D5F63" text-anchor="middle" >Første gang en forenkling dukker opp i spillet,</text>
<text x="195" y="698" font-family="'Schibsted Grotesk', sans-serif" font-size="12.5" font-weight="500" fill="#4D5F63" text-anchor="middle" >vises den bak et i-symbol.</text>
<rect x="140" y="832" width="110" height="4" rx="2" fill="#18262B" opacity=".5"/>
