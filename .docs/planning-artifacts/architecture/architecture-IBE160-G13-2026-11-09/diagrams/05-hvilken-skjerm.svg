<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-label="gateFor ser på siste svar og hva fanen har sett, og sjekker åtte vilkår i fast rekkefølge: startskjermer, slutten, oppsummering, oppsett, resultat, årsslutt, hendelse og krisesteg. Første treff vinner. Skyldes ingenting, vises området i adressen. De fire første er fullskjerm, de fire neste tar bare over Hjem.">
  <style>
    .d-bg{fill:var(--d-paper,#F6F3EC)}
    .d-zone{fill:var(--d-zone,#DCE6D2)}
    .d-zone2{fill:var(--d-zone2,#E6EBFA)}
    .d-box{fill:var(--d-surface,#FFFFFF);stroke:var(--d-ink,#1A1C2A);stroke-width:1.5}
    .d-core{fill:var(--d-coral-soft,#FFE3DD);stroke:var(--d-ink,#1A1C2A);stroke-width:2.5}
    .d-hjem{fill:var(--d-coral-soft,#FFE3DD);stroke:var(--d-ink,#1A1C2A);stroke-width:1.5}
    .d-full{fill:var(--d-cobalt-soft,#E6EBFA);stroke:var(--d-ink,#1A1C2A);stroke-width:1.5}
    .d-ghost{fill:none;stroke:var(--d-ink,#1A1C2A);stroke-width:1.5;stroke-dasharray:6 5}
    .d-ln{fill:none;stroke:var(--d-ink,#1A1C2A);stroke-width:1.6}
    .d-dash{stroke-dasharray:6 5}
    .d-ah{fill:var(--d-ink,#1A1C2A)}
    .d-num{fill:var(--d-ink,#1A1C2A)}
    svg text{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--d-ink,#1A1C2A)}
    svg .d-t{font-size:15px;font-weight:800}
    svg .d-s{font-size:12px;font-weight:500;fill:var(--d-muted,#454656)}
    svg .d-c{font-size:13px;font-weight:600}
    svg .d-h{font-size:11px;font-weight:800;letter-spacing:.09em}
    svg .d-n{font-size:12px;font-weight:800;fill:var(--d-paper,#F6F3EC)}
    svg .d-note{font-family:Kalam,'Segoe Print','Comic Sans MS',cursive;font-size:15px;fill:var(--d-cobalt,#2B4CC4)}
  </style>
  <defs>
    <marker id="f5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-ah"/></marker>
  </defs>
  <rect class="d-bg" x="0" y="0" width="960" height="550"/>

  <!-- Inn -->
  <rect class="d-box" x="20" y="150" width="200" height="90" rx="10"/>
  <text class="d-t" x="120" y="180" text-anchor="middle">Siste svar</text>
  <text class="d-s" x="120" y="200" text-anchor="middle">+ hva denne fanen</text>
  <text class="d-s" x="120" y="216" text-anchor="middle">allerede har vist</text>
  <path class="d-ln" d="M120 240 V288" marker-end="url(#f5a)"/>
  <rect class="d-core" x="20" y="290" width="200" height="76" rx="10"/>
  <text class="d-t" x="120" y="322" text-anchor="middle">gateFor()</text>
  <text class="d-s" x="120" y="342" text-anchor="middle">én funksjon,</text>
  <text class="d-s" x="120" y="358" text-anchor="middle">fast rekkefølge</text>
  <text class="d-note" x="120" y="410" text-anchor="middle">første treff</text>
  <text class="d-note" x="120" y="432" text-anchor="middle">vinner</text>

  <!-- Ryggrad -->
  <path class="d-ln" d="M220 328 H262 M262 60 V467"/>
  <path class="d-ln" d="M262 60 H282 M262 110 H282 M262 160 H282 M262 210 H282 M262 260 H282 M262 310 H282 M262 360 H282 M262 410 H282 M262 467 H282"/>

  <!-- Rader -->
  <circle class="d-num" cx="294" cy="60" r="12"/><text class="d-n" x="294" y="64" text-anchor="middle">1</text>
  <text class="d-c" x="316" y="65">ingen liv ennå, eller «Spill på nytt»</text>
  <path class="d-ln" d="M590 60 H618" marker-end="url(#f5a)"/>
  <rect class="d-full" x="620" y="42" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="65">Startskjermer</text>

  <circle class="d-num" cx="294" cy="110" r="12"/><text class="d-n" x="294" y="114" text-anchor="middle">2</text>
  <text class="d-c" x="316" y="115">livet er fullført</text>
  <path class="d-ln" d="M590 110 H618" marker-end="url(#f5a)"/>
  <rect class="d-full" x="620" y="92" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="115">Slutten</text>

  <circle class="d-num" cx="294" cy="160" r="12"/><text class="d-n" x="294" y="164" text-anchor="middle">3</text>
  <text class="d-c" x="316" y="165">etter innlogging, eller 1 time borte</text>
  <path class="d-ln" d="M590 160 H618" marker-end="url(#f5a)"/>
  <rect class="d-full" x="620" y="142" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="165">Oppsummering</text>

  <circle class="d-num" cx="294" cy="210" r="12"/><text class="d-n" x="294" y="214" text-anchor="middle">4</text>
  <text class="d-c" x="316" y="215">avatar eller pengegave mangler</text>
  <path class="d-ln" d="M590 210 H618" marker-end="url(#f5a)"/>
  <rect class="d-full" x="620" y="192" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="215">Oppsett</text>

  <circle class="d-num" cx="294" cy="260" r="12"/><text class="d-n" x="294" y="264" text-anchor="middle">5</text>
  <text class="d-c" x="316" y="265">et valg ble nettopp lagret</text>
  <path class="d-ln" d="M590 260 H618" marker-end="url(#f5a)"/>
  <rect class="d-hjem" x="620" y="242" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="265">Resultat</text>

  <circle class="d-num" cx="294" cy="310" r="12"/><text class="d-n" x="294" y="314" text-anchor="middle">6</text>
  <text class="d-c" x="316" y="315">året er omme (desember)</text>
  <path class="d-ln" d="M590 310 H618" marker-end="url(#f5a)"/>
  <rect class="d-hjem" x="620" y="292" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="315">Årsslutt</text>

  <circle class="d-num" cx="294" cy="360" r="12"/><text class="d-n" x="294" y="364" text-anchor="middle">7</text>
  <text class="d-c" x="316" y="365">hendelse eller kortvarsel venter</text>
  <path class="d-ln" d="M590 360 H618" marker-end="url(#f5a)"/>
  <rect class="d-hjem" x="620" y="342" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="365">Hendelse</text>

  <circle class="d-num" cx="294" cy="410" r="12"/><text class="d-n" x="294" y="414" text-anchor="middle">8</text>
  <text class="d-c" x="316" y="415">krisesteg venter</text>
  <path class="d-ln" d="M590 410 H618" marker-end="url(#f5a)"/>
  <rect class="d-hjem" x="620" y="392" width="280" height="36" rx="8"/>
  <text class="d-t" x="638" y="415">Krisesteg</text>

  <text class="d-c" x="316" y="472">ingenting skyldes</text>
  <path class="d-ln" d="M590 467 H618" marker-end="url(#f5a)"/>
  <rect class="d-box" x="620" y="442" width="280" height="52" rx="8"/>
  <text class="d-t" x="638" y="464">Området i adressen</text>
  <text class="d-s" x="638" y="483">/hjem /plan /mobil /jobb /penger /aaret</text>

  <!-- Forklaring -->
  <rect class="d-full" x="316" y="516" width="18" height="14" rx="3"/>
  <text class="d-s" x="342" y="528">Fullskjerm: ingen faner, menyen virker</text>
  <rect class="d-hjem" x="620" y="516" width="18" height="14" rx="3"/>
  <text class="d-s" x="646" y="528">Tar over Hjem: de andre fanene virker</text>
</svg>
